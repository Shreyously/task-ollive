apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive
    app.kubernetes.io/component: postgres
spec:
  # Postgres is stateful — only 1 replica.
  # For HA, use a StatefulSet with streaming replication (out of scope here).
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    # Recreate: take the old pod down before starting new one.
    # This avoids two pods competing for the ReadWriteOnce PVC.
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: ollive
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # Pull credentials from Secret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ollive-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ollive-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ollive-secrets
                  key: POSTGRES_DB
            # Tune shared_buffers for low-memory dev environments.
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
