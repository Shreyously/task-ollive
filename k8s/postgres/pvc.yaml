apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName is omitted — uses the cluster default.
  # For k3s this is "local-path"; for minikube it is "standard".
  # Uncomment and set if you need a specific class:
  # storageClassName: local-path
