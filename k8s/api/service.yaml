apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive
    app.kubernetes.io/component: api
spec:
  # NodePort: reachable from your host machine at http://localhost:30001
  # Also reachable within the cluster at api:3001 via ClusterIP.
  type: NodePort
  selector:
    app: api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
