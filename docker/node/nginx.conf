server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that doesn't match a static file
    # gets rewritten to index.html so React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache busting: static assets with hashed names can be cached aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend service
    location /api/ {
        # The trailing slash strips '/api' before forwarding to the backend
        proxy_pass http://api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health probe endpoint for k8s readiness/liveness.
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
