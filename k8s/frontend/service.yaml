apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ollive
  labels:
    app.kubernetes.io/name: ollive
    app.kubernetes.io/component: frontend
spec:
  # NodePort: reachable from your host machine at http://localhost:30080
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
